name: devhelper

services:
  nginx:
    build: ./containers/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "${NGINX_CONF_ROOT}:/etc/nginx/conf.d"
      - "${NGINX_EXTERNAL_ROOT}:/etc/nginx/external"
      - "${APPS_ROOT}:/var/www/apps"
      - "${DATA_ROOT}/nginx-logs:/var/log/nginx"
    depends_on:
      - php83
      - mysql
      - postgres

  mysql:
    build: containers/mysql-8.4
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: devhelper
    ports:
      - "3384:3306"
    volumes:
      - "${DATA_ROOT}/mysql-8.4:/var/lib/mysql"
    cap_add:
      - SYS_NICE
    command: --mysql-native-password=ON

  mysql9:
    build: containers/mysql-9.7
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: devhelper
    ports:
      - "3396:3306"
    volumes:
      - "${DATA_ROOT}/mysql-9.7:/var/lib/mysql"
    cap_add:
      - SYS_NICE

  mariadb10:
    build: ./containers/mariadb-10.6
    environment:
      MARIADB_ROOT_HOST: "%"
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MARIADB_DATABASE: devhelper
    ports:
      - "33106:3306"
    volumes:
      - "${DATA_ROOT}/mariadb10:/var/lib/mysql"
    cap_add:
      - SYS_NICE

  mariadb12:
    build: ./containers/mariadb-12
    environment:
      MARIADB_ROOT_HOST: "%"
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MARIADB_DATABASE: devhelper
    ports:
      - "3312:3306"
    volumes:
      - "${DATA_ROOT}/mariadb12:/var/lib/mysql"
    cap_add:
      - SYS_NICE

  postgres:
    image: postgres:18-bookworm
    restart: always
    environment:
      POSTGRES_DB: devhelper
      POSTGRES_PASSWORD: "${POSTGRES_SUPER_PASSWORD}"
    ports:
      - "5434:5432"
    volumes:
      - "${DATA_ROOT}/postgres:/var/lib/postgresql"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - "${DATA_ROOT}/redis:/data"

  memcached:
    image: memcached:1.6-alpine
    ports: ["11211:11211"]

  # PHP 5.6 to 8.1 build on the latest ghcr.io/rcooler/php-eol-patched <release>-debian images (pull: true):
  # the official images with selected security backports compiled in (github.com/RCooLeR/php-eol-patched).
  # Only 7.1, 7.2 and 8.0 are enabled. To enable another version, uncomment it and add it to
  # SupportedPHPVersions in internal/provision/provision.go. FastCGI has no authentication: keep FPM on loopback.
#  php56: { build: { context: ./containers/php/php5.6, pull: true }, ports: ["127.0.0.1:9156:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
#  php70: { build: { context: ./containers/php/php7.0, pull: true }, ports: ["127.0.0.1:9170:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  php71: { build: { context: ./containers/php/php7.1, pull: true }, ports: ["127.0.0.1:9171:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  php72: { build: { context: ./containers/php/php7.2, pull: true }, ports: ["127.0.0.1:9172:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
#  php73: { build: { context: ./containers/php/php7.3, pull: true }, ports: ["127.0.0.1:9173:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
#  php74: { build: { context: ./containers/php/php7.4, pull: true }, ports: ["127.0.0.1:9174:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  php80: { build: { context: ./containers/php/php8.0, pull: true }, ports: ["127.0.0.1:9180:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
#  php81: { build: { context: ./containers/php/php8.1, pull: true }, ports: ["127.0.0.1:9181:9000"], volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  php82: { build: ./containers/php/php8.2, volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  php83: { build: ./containers/php/php8.3, volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  php84: { build: ./containers/php/php8.4, volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  php85: { build: ./containers/php/php8.5, volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }
  # PHP 8.6 builds from the release-candidate image until 8.6.0 is published (see its Dockerfile).
  php86: { build: ./containers/php/php8.6, volumes: ["${APPS_ROOT}:/var/www/apps"], working_dir: /var/www/apps }

user www-data;
worker_processes 4;
worker_rlimit_nofile 5000;
pid /run/nginx.pid;


events {
	worker_connections 1000;
	multi_accept on;
}

http {

	##
	# Basic Settings
	##
	charset utf-8;
	sendfile off;
	directio 8M;
	directio_alignment 4k;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 4096;
	server_tokens off;
	fastcgi_buffers 32 32k;
	fastcgi_buffer_size 32k;

    proxy_buffering off;
	proxy_read_timeout 300000;
    proxy_connect_timeout 600000;
	server_names_hash_bucket_size 512;
	client_max_body_size 500M;
	# server_name_in_redirect off;
	client_header_timeout 600000;
	client_body_timeout   600000;
	fastcgi_read_timeout   600000;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip off; #no need on dev
	gzip_disable "msie6";

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript  image/svg+xml svg svgz;

	##
	# nginx-naxsi config
	##
	# Uncomment it if you installed nginx-naxsi
	##

	#include /etc/nginx/naxsi_core.rules;

	##
	# nginx-passenger config
	##
	# Uncomment it if you installed nginx-passenger
	##

	#passenger_root /usr;
	#passenger_ruby /usr/bin/ruby;

	##
	#Security
	##
	add_header X-Content-Type-Options nosniff;
	add_header X-XSS-Protection "1; mode=block";

	##
	# Virtual Host Configs
	##
	include /etc/nginx/conf.d/*.conf;
}

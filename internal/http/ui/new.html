<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>New project • devhelper</title>
    <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<header>
    <div class="row" style="align-items:center">
        <div><a href="/">← Back</a></div>
        <div style="text-align:right"><strong>New project</strong></div>
    </div>
</header>
<div class="row" style="align-items:center;justify-content: center">
    <img src="/static/dev-helper.png" alt="" width="200">
</div>
<main>
    <div class="card">
        <div class="grid">
            <div>
                <label>Company</label>
                <input id="company" placeholder="example-company"/>
            </div>
            <div>
                <label>Project</label>
                <input id="project" placeholder="example-project"/>
            </div>
            <div>
                <label>Type</label>
                <select id="type">
                    <option value="wordpress">wordpress</option>
                    <option value="laravel">laravel</option>
                    <option value="yii2">yii2</option>
                    <option value="symfony">symfony</option>
                    <option value="other" selected>other</option>
                </select>
            </div>
            <div>
                <label>PHP</label>
                <select id="php">
                    <option>7.1</option>
                    <option>7.2</option>
                    <option>7.3</option>
                    <option>7.4</option>
                    <option>8.0</option>
                    <option>8.1</option>
                    <option>8.2</option>
                    <option selected>8.3</option>
                    <option>8.4</option>
                </select>
            </div>
            <div>
                <label>DB</label>
                <select id="db">
                    <option value="none" selected>none</option>
                    <option value="mysql">mysql</option>
                    <option value="postgres">postgres</option>
                </select>
            </div>

            <div style="grid-column: 1 / -1; margin-top: 10px;">
                <div class="small">Optional: import SQL dump after create (host path)</div>
                <div class="row" style="margin-top:8px">
                    <div style="flex:2">
                        <label>Dump file (.sql)</label>
                        <input id="import_file" placeholder="E:\dumps\project.sql"/>
                    </div>
                    <div style="flex:1">
                        <label>&nbsp;</label>
                        <div class="row" style="align-items:center;justify-content: flex-start;gap:8px;height: 36px;">
                            <input type="checkbox" id="import_on_create" style="width: 40px;"/>
                            <span class="small">Import after create</span>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <label>Domain (optional)</label>
                <input id="domain" placeholder="default: <project>.<company>.local"/>
                <div class="small">Default pattern: <code>{{.DefaultPattern}}</code></div>
            </div>
        </div>

        <div class="row" style="margin-top:14px">
            <div>
                <button onclick="create()">Create</button>
            </div>
            <div>
                <button class="secondary" onclick="location.href='/'">Cancel</button>
            </div>
        </div>

        <div id="out" style="margin-top:12px"></div>
    </div>
</main>

<script>
    async function create() {
        const out = document.getElementById('out');
        out.textContent = '';
        const body = {
            company: document.getElementById('company').value,
            project: document.getElementById('project').value,
            type: document.getElementById('type').value,
            php: document.getElementById('php').value,
            db: document.getElementById('db').value,
            domain: document.getElementById('domain').value,
            import_file: document.getElementById('import_file').value,
            import_on_create: document.getElementById('import_on_create').checked
        };
        const res = await fetch('/api/projects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
            out.innerHTML = '<span class="warn">Error: ' + (data.error || res.statusText) + '</span>';
            return;
        }
        out.innerHTML = '<div class="small">Created. Domain: <code>' + data.project.domain + '</code></div>';
        if (data.warnings && data.warnings.length) {
            out.innerHTML += '<div class="warn small">Warnings: ' + data.warnings.join('; ') + '</div>';
        }
        out.innerHTML += '<div class="small"><a href="/">Back to list</a></div>';
    }
</script>
</body>
</html>
